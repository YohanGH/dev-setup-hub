name: Bug report
description: Report a problem with Halo
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `halo ...`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Halo version
      description: Output of `halo --version`.
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Display server
      options: [Wayland, X11, Not sure]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Distro / compositor
      placeholder: e.g. Arch + Hyprland, Fedora + GNOME
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output (run with `RUST_LOG=debug halo`).
      render: shell
