# Controles de securite/maintenance rappeles par check.sh — dates d'execution
# uniquement. Cet outil ne lance jamais lui-meme une mise a jour, une
# sauvegarde ou un audit : il rappelle qu'ils sont dus et propose la commande.
#
# Un controle par bloc [nom], une cle par ligne :
#
#   [nom]                identifiant court, utilise par --done <nom>
#   libelle = texte affiche
#   seuil = jours au-dela desquels le controle est signale en echeance depassee
#   commande = affichee quand le controle n'a jamais ete fait ou est en retard
#              — jamais executee par check.sh lui-meme
#   date_macos = commande shell, evaluee par `eval` : imprime la date ISO du
#   date_debian  dernier passage REEL, relevee sur la machine, ou rien. Repond
#                a « c'etait quand ». Sans elle, un apt upgrade lance il y a
#                cinq minutes s'affichait encore « jamais enregistre » : le
#                fichier d'etat ne connait que ce qu'on lui a declare.
#                Toute sortie qui n'est pas une date ISO est ignoree.
#   preuve_macos = commande shell, evaluee par `eval` : SILENCIEUSE si tout va
#   preuve_debian  bien, imprime UNE ligne de diagnostic sinon. Repond a
#                  « qu'est-ce qui cloche maintenant ». Ni l'une ni l'autre ne
#                  repose sur le code de sortie de l'outil sonde — tmutil
#                  latestbackup rend 0 meme quand il echoue reellement, donc
#                  le seul signal fiable est la sortie elle-meme.
#
# Les quatre cles systeme sont facultatives : vides, le controle retombe sur la
# seule date declaree — cas du backup sous Debian, voir docs/CHECKS.md.
#
# Les helpers checks_file_date / checks_newest_date de lib/checks.sh sont
# disponibles dans ces commandes : ils rendent la mtime d'un fichier au format
# ISO, en masquant la difference entre le stat de BSD et celui de GNU.
#
# Format par blocs plutot que des lignes '|' comme external.conf : les
# commandes de preuve contiennent elles-memes des pipes, qui casseraient un
# separateur '|'.

[update]
libelle = Mises a jour systeme
seuil = 7
commande = ./install/00-packages.sh
# Deux traces par plateforme, parce que ./install/00-packages.sh fait deux
# choses : rafraichir l'index (FETCH_HEAD, pkgcache.bin) et installer
# reellement (le dernier dossier du Cellar, history.log).
date_macos = checks_newest_date "$(brew --repository 2>/dev/null)/.git/FETCH_HEAD" "$(ls -td "$(brew --cellar 2>/dev/null)"/*/* 2>/dev/null | head -1)"
date_debian = checks_newest_date /var/cache/apt/pkgcache.bin /var/log/apt/history.log /var/lib/apt/periodic/update-success-stamp
# HOMEBREW_NO_AUTO_UPDATE : sans lui, sonder l'etat des paquets peut declencher
# un `brew update` en douce. Un outil qui promet de ne jamais rien mettre a
# jour n'a pas le droit de le faire par effet de bord.
preuve_macos = n=$(HOMEBREW_NO_AUTO_UPDATE=1 brew outdated 2>/dev/null | wc -l | tr -d ' '); [ "$n" -eq 0 ] || echo "$n paquet(s) Homebrew en retard"
preuve_debian = n=$(apt-get -s upgrade 2>/dev/null | grep -c '^Inst ' || true); [ "${n:-0}" -eq 0 ] || echo "$n paquet(s) apt en retard"

[backup]
libelle = Sauvegarde
seuil = 7
commande = tmutil startbackup
# Le dossier de sauvegarde s'appelle 2026-09-10-183245 : la date est dans son
# nom, inutile d'aller lire une mtime. Silencieux si le disque n'est pas la.
date_macos = b=$(tmutil latestbackup 2>/dev/null || true); b=${b%/}; b=${b##*/}; case "$b" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]*) printf '%s' "${b:0:10}" ;; esac
date_debian =
preuve_macos = out=$(tmutil latestbackup 2>&1); case "$out" in /*) ;; *) echo "$out" ;; esac
preuve_debian =

[analyse]
libelle = Audit de securite (lynis)
seuil = 30
commande = sudo lynis audit system
# lynis ecrit dans /var/log sous sudo et dans $HOME sans : ne regarder que
# /var/log manquait tous les audits lances sans privileges. Seule la mtime est
# lue — le fichier appartient a root en 0640 et n'est pas lisible ici.
#
# Le journal et non le rapport : `lynis show options` reecrit lynis-report.dat
# sans avoir rien audite, alors qu'il laisse lynis.log intact. Avec -s, un
# journal vide — celui que `lynis show` cree quand il n'existe pas — ne compte
# pas non plus.
date_macos = checks_newest_date -s /var/log/lynis.log "$HOME/lynis.log"
date_debian = checks_newest_date -s /var/log/lynis.log "$HOME/lynis.log"
# La fraicheur du rapport est desormais l'affaire de la ligne de date ci-dessus.
# Il reste a signaler le cas ou l'outil n'est meme pas la : sans lui, la
# commande proposee au-dessus echouerait sans expliquer pourquoi.
preuve_macos = command -v lynis >/dev/null 2>&1 || echo "lynis absent — paquet optionnel, ./install/00-packages.sh l installe"
preuve_debian = command -v lynis >/dev/null 2>&1 || echo "lynis absent — paquet optionnel, ./install/00-packages.sh l installe"
