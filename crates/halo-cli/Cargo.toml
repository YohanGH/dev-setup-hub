overlay = ["halo-daemon/overlay"]

[dependencies]
halo-config.workspace = true
halo-daemon.workspace = true
clap.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
