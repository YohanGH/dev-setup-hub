[package]
name = "halo-ui"
description = "Transparent, click-through overlay rendering for the Halo HUD."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The GPU overlay backend (eframe/egui) and the settings GUI. Opt-in so the
# default build stays lightweight and headless-friendly. Requires a desktop
# session (X11 / Wayland / macOS / Windows) to run.
overlay = ["dep:eframe", "dep:global-hotkey"]
gui = ["overlay"]

[dependencies]
halo-core.workspace = true
halo-config.workspace = true
halo-themes.workspace = true
tracing.workspace = true

eframe = { version = "0.31", optional = true, default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
global-hotkey = { version = "0.6", optional = true }

[lints]
workspace = true
