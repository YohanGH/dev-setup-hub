# cargo-deny configuration — supply-chain, licence and advisory gate.
# Run locally with `cargo deny check`. Enforced in CI (security workflow).

[graph]
# Audit the whole workspace, including the opt-in `overlay`/`gui` backend, so
# the eframe/egui GPU subtree is covered by the supply-chain gate rather than
# silently skipped with the default feature set.
all-features = true

[advisories]
# Fail the build on any known security advisory or unmaintained crate.
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained (no security impact, no fix available). It is
    # reachable only through the opt-in `overlay` backend's font stack
    # (eframe → egui → epaint → ab_glyph → owned_ttf_parser → ttf-parser), not
    # in the default build. Revisit when egui migrates off ab_glyph/ttf-parser.
    "RUSTSEC-2026-0192",
]

[licenses]
# Only permissive licences compatible with MIT are allowed into the tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# Per-crate allowances kept out of the global list to stay narrow. All are
# permissive licences reachable only through the opt-in `overlay` backend.
exceptions = [
    # egui's bundled default fonts (Ubuntu font family + others) ship under the
    # SIL Open Font License and the Ubuntu Font Licence — standard permissive
    # font licences, fine to redistribute.
    { name = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
    # Boost Software Licence (permissive). Windows clipboard backend pulled in
    # transitively by arboard/egui-winit; only ever compiled on Windows.
    { name = "clipboard-win", allow = ["BSL-1.0"] },
    { name = "error-code", allow = ["BSL-1.0"] },
]

[bans]
# Flag duplicate versions of the same crate; keep the dependency tree lean.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only accept crates from the official registry.
unknown-registry = "deny"
unknown-git = "deny"
