# Example Halo configuration.
# Copy to ~/.config/halo/config.toml and edit to taste.
# Every field is optional; omitted keys fall back to the built-in defaults.

# Anchor position of the overlay: top-left | top-right | bottom-left | bottom-right
position = "top-right"

# Overlay opacity, 0.0 (invisible) .. 1.0 (opaque)
opacity = 0.55

# Refresh interval in milliseconds
refresh_ms = 500

# Active theme (see the halo-themes crate)
theme = "minimal"

# Base font size in points
font_size = 18

# Enabled widgets, in display order. Omit this key to use the default set
# (cpu, ram, swap, disk, net, temp). Available ids: cpu, ram, swap, disk, net,
# temp, gpu, clock. An empty list hides everything.
# widgets = ["cpu", "ram", "net", "temp", "clock"]
