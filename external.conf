# Depots externes recuperes a l'installation, et NON copies dans ce depot.
#
# Un projet qui vit dans son propre depot GitHub ne doit pas etre duplique ici :
# la copie derive de l'amont des le premier commit et personne ne sait plus
# laquelle fait foi. install/50-external.sh les clone ou les met a jour.
#
# Format, champs separes par '|' :
#
#   nom | url | destination | plateforme | defaut | commande de construction
#
#   nom          identifiant court, utilise par --with <nom>
#   url          depot git a cloner
#   destination  chemin local ; '~' est deplie
#   plateforme   all | macos | linux
#   defaut       on  = recupere par defaut
#                off = ignore sauf si --with <nom> est passe
#   construction commande lancee dans la destination apres clonage.
#                Vide = rien a construire.
#
# AUCUN de ces depots ne publie de release ni de tag a ce jour
# (verifie via l'API GitHub) : il n'y a donc pas de binaire a telecharger,
# seulement des sources a cloner, et a compiler pour halo.

# --- Base de connaissances Claude Code -------------------------------------- #
# Documentation et modeles a lire et recopier ; rien ne s'installe.
claude-config | https://github.com/YohanGH/claude-config | ~/.config/claude-config | all | on |

# --- Halo ------------------------------------------------------------------- #
# HUD systeme en Rust, Linux uniquement (overlay Wayland / X11) : la cible
# macOS n'existe pas. Desactive par defaut car la compilation demande un
# toolchain Rust complet et prend plusieurs minutes.
#   ./install/50-external.sh --with halo
halo | https://github.com/YohanGH/Halo | ~/.local/src/halo | linux | off | cargo build --release
