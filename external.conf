# Depots externes recuperes a l'installation, et NON copies dans ce depot.
#
# Un projet qui vit dans son propre depot GitHub ne doit pas etre duplique ici :
# la copie derive de l'amont des le premier commit et personne ne sait plus
# laquelle fait foi. install/50-external.sh les recupere ou les met a jour.
#
# Format, champs separes par '|' :
#
#   nom | url | destination | plateforme | defaut | commande de construction | indice asset
#
#   nom          identifiant court, utilise par --with <nom>
#   url          depot GitHub (sert aussi a interroger son API)
#   destination  chemin local ; '~' est deplie
#   plateforme   all | macos | linux
#   defaut       on  = recupere par defaut
#                off = ignore sauf si --with <nom> est passe
#   construction commande lancee apres recuperation des SOURCES seulement
#                (jamais quand un binaire de release a ete recupere).
#                Vide = rien a construire.
#   indice asset sous-chaine cherchee dans le nom des assets de la derniere
#                release pour reconnaitre le binaire de cette plateforme.
#                Vide = ce depot ne publie pas de binaire (docs, scripts...).
#
# STRATEGIE DE RECUPERATION, par ordre de preference :
#   1. un binaire de release qui correspond a l'indice asset  -> telecharge,
#      verifie (sha256), rien a construire. Un binaire nomme comme l'entree
#      est en prime lie dans ~/.local/bin/<nom>.
#   2. a defaut, l'archive SOURCE de la derniere release (tag fige, pas la
#      branche par defaut) -> extraite, puis la construction si declaree.
#   3. a defaut de toute release, clone Git de la branche par defaut — seul
#      chemin qui existait avant que ces deux depots publient une release.
#
# Chaque etape se degrade vers la suivante plutot que d'echouer : sans lecteur
# JSON, sans reseau, ou si GitHub limite les requetes, on retombe sur le clone.

# --- Base de connaissances Claude Code -------------------------------------- #
# Documentation et modeles a lire et recopier ; rien a construire, aucun
# binaire de release possible pour ce type de contenu.
claude-config | https://github.com/YohanGH/claude-config | ~/.config/claude-config | all | on | |

# --- Halo ------------------------------------------------------------------- #
# HUD systeme en Rust, Linux uniquement (overlay Wayland / X11) : la cible
# macOS n'existe pas. Desactive par defaut : meme avec un binaire de release,
# c'est un HUD graphique, pas un outil de tous les jours sur un poste de dev.
#   ./install/50-external.sh --with halo
# L'archive "-desktop" contient `halo overlay` ET `halo settings` ; c'est
# celle-la qu'on cherche (voir release.yml du depot Halo pour le detail).
halo | https://github.com/YohanGH/Halo | ~/.local/src/halo | linux | off | cargo build --release | linux-desktop
